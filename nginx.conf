worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # SSE timeout — long-polling / event streams
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    upstream quark_api {
        server quark-api:8000;
    }

    upstream quark_frontend {
        server quark-frontend:80;
    }

    upstream uptime_kuma {
        server uptime-kuma:3001;
    }

    upstream quark_mosquitto_ws {
        server quark-mosquitto:9001;
    }

    server {
        listen 80;
        server_name quark.quoding.com;

        # Cloudflare Tunnel terminates TLS — serve HTTP internally
        location /api/ {
            proxy_pass http://quark_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE: disable buffering
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding on;
        }

        location /ws {
            proxy_pass http://quark_api/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # MQTT over WebSocket — 브라우저는 wss://quark.quoding.com/mqtt 로 접속,
        # Cloudflare Tunnel이 TLS 종단 후 여기로 들어오면 mosquitto 9001(ws)로 프록시
        location /mqtt {
            proxy_pass http://quark_mosquitto_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        location / {
            proxy_pass http://quark_frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 80;
        server_name uptime.quoding.com;

        location / {
            proxy_pass http://uptime_kuma/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
