listener 1883
listener 9001
protocol websockets

# Authentication — required for all connections
allow_anonymous false
password_file /mosquitto/config/password_file

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Connection limits
max_connections 100
max_keepalive 300

# TLS (disabled — Cloudflare Tunnel handles TLS termination)
# tls_version tlsv1.3
